imports:
    - { resource: "@SyliusWishlistPlugin/config/config.yaml" }
    - { resource: "@BitExpertSyliusWishlistConciergePlugin/config/config.yaml" }
    - { resource: "services_test.php" }

parameters:
    sylius_wishlist_api_platform_mapping_path: '%kernel.project_dir%/../../../vendor/sylius/wishlist-plugin/config/api_platform/'

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

doctrine_migrations:
    migrations_paths:
        'BitExpertSyliusWishlistConciergePlugin': '%kernel.project_dir%/../../../src/Migrations'

